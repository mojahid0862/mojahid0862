<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="376" viewBox="0 0 1000 376" role="img" aria-labelledby="title desc">
  <title id="title">Mojahid-Ul Haque - DevOps Engineer</title>
  <desc id="desc">A terminal window. whoami prints Mojahid-Ul Haque. cat /etc/motd prints DevOps Engineer, New Delhi, India, 3x AWS Certified, and the stack AWS, Azure, GCP, Kubernetes, Terraform, Docker, CI/CD, Observability. systemctl is-active availability.service prints active, open to remote opportunities.</desc>
  <defs>
    <clipPath id="win"><rect x="0.5" y="0.5" width="999" height="375" rx="12"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="375" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="0.5" y="0.5" width="999" height="44" fill="#f6f8fa" clip-path="url(#win)"/>
  <line x1="0.5" y1="44.5" x2="999.5" y2="44.5" stroke="#d0d7de"/>
  <circle cx="26" cy="22.5" r="6" fill="#ff5f57"/>
  <circle cx="46" cy="22.5" r="6" fill="#febc2e"/>
  <circle cx="66" cy="22.5" r="6" fill="#28c840"/>
  <text x="500" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#656d76">mojahid@devops: ~</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20" fill="#1f2328">
    <text x="32" y="88"><tspan fill="#1a7f37">mojahid@devops</tspan><tspan fill="#656d76">:</tspan><tspan fill="#0969da">~</tspan><tspan fill="#656d76">$</tspan> whoami</text>
    <text x="32" y="132" font-size="40" font-weight="700" fill="#1f2328">Mojahid-Ul Haque</text>
    <text x="32" y="178"><tspan fill="#1a7f37">mojahid@devops</tspan><tspan fill="#656d76">:</tspan><tspan fill="#0969da">~</tspan><tspan fill="#656d76">$</tspan> cat /etc/motd</text>
    <text x="32" y="208">DevOps Engineer · New Delhi, India · 3x AWS Certified</text>
    <text x="32" y="236" fill="#656d76">AWS · Azure · GCP · Kubernetes · Terraform · Docker · CI/CD · Observability</text>
    <text x="32" y="282"><tspan fill="#1a7f37">mojahid@devops</tspan><tspan fill="#656d76">:</tspan><tspan fill="#0969da">~</tspan><tspan fill="#656d76">$</tspan> systemctl is-active availability.service</text>
    <text x="32" y="310"><tspan fill="#1a7f37">● active</tspan> <tspan fill="#656d76">— open to remote opportunities</tspan></text>
    <text x="32" y="350"><tspan fill="#1a7f37">mojahid@devops</tspan><tspan fill="#656d76">:</tspan><tspan fill="#0969da">~</tspan><tspan fill="#656d76">$</tspan> <tspan fill="#1f2328">█<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
